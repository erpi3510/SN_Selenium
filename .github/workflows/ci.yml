name: Simple Test Pipeline mit ServiceNow Change Control
'on':
  push:
    branches:
      - CICD
jobs:
  create-servicenow-change:
    runs-on: ubuntu-latest
    steps:
      - name: Change Request via REST API
        env:
          SN_INSTANCE_URL: ${{ secrets.SN_INSTANCE_URL }}
          SN_DEVOPS_USER: ${{ secrets.SN_DEVOPS_USER }}
          SN_DEVOPS_PASSWORD: ${{ secrets.SN_DEVOPS_PASSWORD }}
        run: |
          ENCODED_AUTH=$(echo -n "$SN_DEVOPS_USER:$SN_DEVOPS_PASSWORD" | base64)

          curl -X POST "$SN_INSTANCE_URL/api/now/table/change_request" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic $ENCODED_AUTH" \
            -d '{
                  "short_description": "Deployment via GitHub Actions",
                  "category": "Software",
                  "priority": "2",
                  "start_date": "2025-06-25 12:00:00",
                  "end_date": "2025-06-25 13:00:00",
                  "comments": "Created by CI/CD pipeline"
                }'
