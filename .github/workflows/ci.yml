# .github/workflows/main.yml

name: CI Pipeline

on:
  push:
    branches: [main]      # oder z. B. ["main", "develop"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Code kompilieren
        run: echo "Compiling the code..."

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Unit Tests
        run: |
          echo "Running unit tests... This will take about 60 seconds."
          sleep 60
          echo "Tests abgeschlossen"

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Code-Analyse (Linting)
        run: |
          echo "Linting code..."
          sleep 10
          echo "Keine Fehler gefunden"

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Deploy Schritt
        run: |
          echo "Deploying application..."
          echo "Application successfully deployed."
