name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Use Debian-based Docker container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace python:3.9-slim bash -c "\
            apt-get update && apt-get install -y gcc && \
            pip install --upgrade pip && \
            pip install -r requirements.txt && \
            pytest"
